global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:5000"]
  - job_name: servico-pedidos
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-pedidos:5001"]
  - job_name: servico-pagamentos
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-pagamentos:5002"]
  - job_name: servico-estoque
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-estoque:5003"]
