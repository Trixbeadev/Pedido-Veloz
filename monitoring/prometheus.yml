global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:5000"]

  - job_name: "pedidos"
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-pedidos:5001"]

  - job_name: "pagamentos"
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-pagamentos:5002"]

  - job_name: "estoque"
    metrics_path: /metrics
    static_configs:
      - targets: ["servico-estoque:5003"]
