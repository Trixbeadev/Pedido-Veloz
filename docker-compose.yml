services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  servico-pedidos:
    build:
      context: ./servico-pedidos
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5001
    expose:
      - "5001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  servico-pagamentos:
    build:
      context: ./servico-pagamentos
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5002
    expose:
      - "5002"
    networks:
      - backend

  servico-estoque:
    build:
      context: ./servico-estoque
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5003
    expose:
      - "5003"
    networks:
      - backend

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      PEDIDOS_URL: http://servico-pedidos:5001
      PAGAMENTOS_URL: http://servico-pagamentos:5002
      ESTOQUE_URL: http://servico-estoque:5003
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    depends_on:
      - servico-pedidos
      - servico-pagamentos
      - servico-estoque
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: