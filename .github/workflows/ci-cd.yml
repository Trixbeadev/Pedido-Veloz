name: CI/CD - Pedidos Veloz

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes e verificacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            gateway/requirements.txt
            servico-*/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r gateway/requirements.txt
          python -m pip install -r servico-pedidos/requirements.txt
          python -m pip install -r servico-pagamentos/requirements.txt
          python -m pip install -r servico-estoque/requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q gateway servico-pedidos servico-pagamentos servico-estoque tests
      - name: Verificar estilo com Ruff
        run: python -m ruff check gateway servico-pedidos servico-pagamentos servico-estoque tests
      - name: Executar testes
        run: python -m pytest -q

  publish:
    name: Build e publicacao de imagens
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: gateway
          - service: servico-pedidos
            context: servico-pedidos
          - service: servico-pagamentos
            context: servico-pagamentos
          - service: servico-estoque
            context: servico-estoque
    steps:
      - uses: actions/checkout@v4
      - name: Normalizar owner do GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/pedidos-veloz-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/pedidos-veloz-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy manual em producao
    needs: publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, pedidos-veloz-private]
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configurar acesso ao cluster
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT" || { echo "Configure o secret KUBECONFIG no ambiente production."; exit 1; }
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Criar namespace e secrets sem gravar credenciais no repositorio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl -n pedidos-veloz create secret generic pedidos-db \
            --from-literal="database-url=$DATABASE_URL" \
            --from-literal="postgres-password=$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n pedidos-veloz create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Aplicar manifests e atualizar imagens
        env:
          OWNER_LC: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER_LC="$(printf '%s' "$OWNER_LC" | tr '[:upper:]' '[:lower:]')"
          kubectl -n pedidos-veloz create configmap prometheus-config \
            --from-file=prometheus.yml=monitoring/prometheus.yml \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n pedidos-veloz create configmap otel-collector-config \
            --from-file=config.yaml=monitoring/otel-collector.yaml \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes/
          kubectl -n pedidos-veloz set image deployment/gateway gateway="ghcr.io/$OWNER_LC/pedidos-veloz-gateway:$IMAGE_TAG"
          kubectl -n pedidos-veloz set image deployment/servico-pedidos servico-pedidos="ghcr.io/$OWNER_LC/pedidos-veloz-servico-pedidos:$IMAGE_TAG"
          kubectl -n pedidos-veloz set image deployment/servico-pagamentos servico-pagamentos="ghcr.io/$OWNER_LC/pedidos-veloz-servico-pagamentos:$IMAGE_TAG"
          kubectl -n pedidos-veloz set image deployment/servico-estoque servico-estoque="ghcr.io/$OWNER_LC/pedidos-veloz-servico-estoque:$IMAGE_TAG"
          kubectl -n pedidos-veloz rollout status deployment/gateway --timeout=180s
          kubectl -n pedidos-veloz rollout status deployment/servico-pedidos --timeout=180s
          kubectl -n pedidos-veloz rollout status deployment/servico-pagamentos --timeout=180s
          kubectl -n pedidos-veloz rollout status deployment/servico-estoque --timeout=180s
